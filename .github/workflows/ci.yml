name: CI

on:
  push:
    branches:
      - main
      - feature/seren-ai-platform
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Run API unit tests
        run: npm test
      - name: Build web and API
        run: npm run build
